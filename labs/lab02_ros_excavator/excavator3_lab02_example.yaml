# Lab 02 example trajectory for Excavator 3.
# Startup holds its observed swing heading; boom/arm/bucket have configured targets.
# This is a classroom example, not a validated physical test.
# Check the actual READY pose and clear the workspace before running.
#
# Each waypoint supplies all four joints because all four are listed below.
# The task client reads this YAML at run time; editing it needs no rebuild.

trajectory_name: excavator3_lab02_small_dig
description: Small dig and return near Excavator 3's initial pose.

joints:
  - swing
  - boom
  - arm
  - bucket

waypoints:
  - name: initial
    swing_direction: +1
    positions:
      swing: 90.0
      boom: -10.0
      arm: 60.0
      bucket: 0.0

  - name: lower_boom
    swing_direction: +1
    positions:
      swing: 90.0
      boom: -25.0
      arm: 60.0
      bucket: 0.0

  - name: small_scoop
    swing_direction: +1
    positions:
      swing: 90.0
      boom: -25.0
      arm: 80.0
      bucket: 90.0

  - name: return_initial
    swing_direction: +1
    positions:
      swing: 90.0
      boom: -10.0
      arm: 60.0
      bucket: 0.0

