# ================================================================
# Excavator 1 Configuration
# ================================================================
# Physical machine configuration for Excavator 1.
#
# Boom, arm, and bucket use potentiometer feedback through ADS1115.
#
# Calibration convention:
#   raw_at_min_angle = ADC raw value at min_angle_deg
#   raw_at_max_angle = ADC raw value at max_angle_deg
#
# Raw ADC values may increase OR decrease as joint angle increases.
#
# Swing feedback is provided externally as sensor_msgs/JointState.
# ================================================================

excavator_name: excavator1


# ================================================================
# JOINT SENSOR CALIBRATION / LIMITS
# ================================================================

joints:

  boom:
    adc_channel: 2
    min_angle_deg: -60.0
    max_angle_deg: 5.0
    raw_at_min_angle: 17940
    raw_at_max_angle: 12045

  arm:
    adc_channel: 1
    min_angle_deg: 52.0
    max_angle_deg: 112.0
    raw_at_min_angle: 17450
    raw_at_max_angle: 11750

  bucket:
    adc_channel: 0
    min_angle_deg: 0.0
    max_angle_deg: 90.0
    raw_at_min_angle: 14270
    raw_at_max_angle: 13100

  swing:
    # Swing position comes from the site perception / sensor adapter.
    #
    # Periodic site heading representation, not physical motor end stops.
    # Verify the observed heading and motor direction on Excavator 1.
    min_angle_deg: -180.0
    max_angle_deg: 180.0


# ================================================================
# GPIO
# ================================================================
# Existing Excavator 1 wiring and motor-direction values are preserved.
# ================================================================

gpio:
  standby_pin: 21
  shared_pwm_pin: 7

  swing:
    in1_pin: 16
    in2_pin: 20
    invert_motor: false

  boom:
    in1_pin: 8
    in2_pin: 25
    invert_motor: true

  arm:
    in1_pin: 15
    in2_pin: 14
    invert_motor: true

  bucket:
    in1_pin: 23
    in2_pin: 24
    invert_motor: false


# ================================================================
# GLOBAL CONTROL PARAMETERS
# ================================================================

control:
  publish_hz: 10.0
  control_hz: 50.0
  feedback_hz: 10.0

  goal_tolerance_rad: 0.035
  stop_on_goal_finish: true

  ads1115_address: 72
  pwm_frequency_hz: 1000
  pwm_arbitration: exclusive


# ================================================================
# STARTUP INITIAL POSITION
# ================================================================
#
# Current startup architecture:
#
#   1. wait for fresh Swing feedback
#   2. preflight
#   3. hold Swing at its observed heading
#   4. correct Boom
#   5. correct Arm
#   6. correct Bucket
#   7. verify three targets and fresh Swing feedback
#   8. READY
#
# IMPORTANT:
#   The startup parameters and target pose below are migrated from the
#   current common configuration structure. They have NOT been
#   physically validated on Excavator 1 as part of this migration.
#
#   Verify Swing feedback, motor direction, PWM values, and the complete
#   startup pose on Excavator 1 before relying on automatic startup.
# ================================================================

initial_position:
  enabled: true
  mode: move

  tolerance_deg: 3.0
  verification_tolerance_deg: 5.0

  current_limit_tolerance_deg: 1.0
  limit_margin_deg: 3.0
  timeout_sec: 25.0

  boom_pwm: 140
  boom_timeout_sec: 5.0
  boom_wrong_way_deg: 10.0

  arm_pwm: 140
  arm_timeout_sec: 5.0
  arm_wrong_way_deg: 10.0

  bucket_pwm: 80
  bucket_timeout_sec: 5.0
  bucket_wrong_way_deg: 10.0

  # TODO:
  #   Physically verify that this is a safe and reachable startup pose
  #   for Excavator 1 before automatic startup is used.
  positions:
    boom: -10.0
    arm: 60.0
    bucket: 0.0


# ================================================================
# PER-JOINT CONTROL PARAMETERS
# ================================================================
#
# Boom, arm, and bucket preserve the existing Excavator 1 controller
# values.
#
# Swing is migrated to the current external-feedback control structure
# and must be physically validated on Excavator 1.
# ================================================================

joint_control:

  swing:
    position_topic: /excavator1/swing_joint_state
    sensor_timeout_sec: 0.30

    # Full periodic site heading; these numbers are not motor end stops.
    command_min_angle_deg: -180.0
    command_max_angle_deg: 180.0

    far_error_deg: 30.0
    far_pwm: 255
    near_pwm: 255

    stop_tolerance_rad: 0.1396 # 8 degrees
    tolerance_rad: 0.2618 # 15 degrees

    pulse_err_deg: 30.0
    pulse_on_cycles: 2
    pulse_off_cycles: 4

    progress_timeout_sec: 0.35
    min_progress_deg: 1.0

  boom:
    kp: 120.0
    min_pwm: 130
    max_pwm: 255
    kick_pwm: 180

    stop_tolerance_rad: 0.0524 # 3 degrees
    tolerance_rad: 0.1745 # 10 degrees


  arm:
    kp: 120.0
    min_pwm: 180
    max_pwm: 220
    kick_pwm: 180

    stop_tolerance_rad: 0.1396 # 8 degrees
    tolerance_rad: 0.2618 # 15 degrees

  bucket:
    kp: 70.0
    min_pwm: 75
    max_pwm: 255
    kick_pwm: 80

    stop_tolerance_rad: 0.1745 # 10 degrees
    tolerance_rad: 0.2618 # 15 degrees