# ================================================================
# Excavator 3 Configuration
# ================================================================
# Physical machine configuration for Excavator 3.
#
# Potentiometer calibration convention for boom, arm, and bucket:
#   raw_at_min_angle = ADC raw value at min_angle_deg
#   raw_at_max_angle = ADC raw value at max_angle_deg
#
# Raw ADC values may increase OR decrease as joint angle increases.
# ================================================================

excavator_name: excavator3

joints:

  boom:
    adc_channel: 1
    min_angle_deg: -60.0
    max_angle_deg: 5.0
    raw_at_min_angle: 7500
    raw_at_max_angle: 14320

  arm:
    adc_channel: 2
    min_angle_deg: 52.0
    max_angle_deg: 112.0
    raw_at_min_angle: 17800
    raw_at_max_angle: 12050

  bucket:
    adc_channel: 0
    min_angle_deg: 0.0
    max_angle_deg: 90.0
    raw_at_min_angle: 1750
    raw_at_max_angle: 25200

  swing:
    # Swing position comes from a sensor adapter publishing JointState.
    # The controller is deliberately independent of AprilTag or any future
    # replacement sensor.
    # Hard observed range. This includes expected coast after motor stop.
    min_angle_deg: -105.0
    max_angle_deg: 105.0

# ================================================================
# GPIO
# ================================================================

gpio:
  standby_pin: 21
  shared_pwm_pin: 7

  swing:
    in1_pin: 16
    in2_pin: 20
    invert_motor: true

  boom:
    in1_pin: 8
    in2_pin: 25
    invert_motor: true

  arm:
    in1_pin: 15
    in2_pin: 14
    invert_motor: true

  bucket:
    in1_pin: 23
    in2_pin: 24
    invert_motor: true

# ================================================================
# GLOBAL CONTROL PARAMETERS
# ================================================================

control:
  publish_hz: 10.0
  control_hz: 50.0
  feedback_hz: 10.0

  goal_tolerance_rad: 0.035
  stop_on_goal_finish: true

  ads1115_address: 72
  pwm_frequency_hz: 1000
  pwm_arbitration: exclusive

# ================================================================
# HOME POSITION
# ================================================================
# Human-readable degrees.
# Boom home intentionally set to -20 deg.

home:
  boom_deg: -20.0
  arm_deg: 105.020
  bucket_deg: 12.245

# ================================================================
# STARTUP INITIAL POSITION
# ================================================================
# Scenario-start pose for Excavator 3. This is intentionally separate
# from calibration/homing. When enabled, the controller waits until ROS
# callbacks are active, moves all four joints to this pose, verifies the
# targets, and only then accepts normal trajectory goals.

initial_position:
  enabled: true
  mode: move

  # A joint already within this tolerance is skipped during startup correction.
  tolerance_deg: 3.0

  # Final READY verification allows a slightly wider band so that sensor
  # noise or small coast after motor stop does not invalidate an otherwise
  # successful startup initialization.
  verification_tolerance_deg: 5.0

  current_limit_tolerance_deg: 1.0
  limit_margin_deg: 3.0
  timeout_sec: 25.0

  # Production initialization moves one joint at a time with continuous drive.
  # Feedback, physical limits, wrong-way motion, target crossing, and per-joint
  # timeout are checked continuously while the selected joint is moving.
  swing_pwm: 160
  swing_timeout_sec: 5.0
  swing_wrong_way_deg: 10.0

  boom_pwm: 140
  boom_timeout_sec: 5.0
  boom_wrong_way_deg: 10.0

  arm_pwm: 140
  arm_timeout_sec: 5.0
  arm_wrong_way_deg: 10.0

  bucket_pwm: 80
  bucket_timeout_sec: 5.0
  bucket_wrong_way_deg: 10.0

  positions:
    swing: 90.0
    boom: -10.0
    arm: 60.0
    bucket: 0.0

# ================================================================
# PER-JOINT CONTROL PARAMETERS
# ================================================================

joint_control:

  swing:
    position_topic: /excavator3/swing_joint_state
    sensor_timeout_sec: 0.30

    # Normal commanded range stays inside the hard observed range.
    command_min_angle_deg: -95.0
    command_max_angle_deg: 95.0

    far_error_deg: 30.0
    far_pwm: 255
    near_pwm: 255

    stop_tolerance_rad: 0.1396 # 8 degrees
    tolerance_rad: 0.2618 # 15 degrees

    pulse_err_deg: 30.0
    pulse_on_cycles: 2
    pulse_off_cycles: 4

    progress_timeout_sec: 0.35
    min_progress_deg: 1.0

  boom:
    kp: 120.0
    min_pwm: 110
    max_pwm: 255
    kick_pwm: 180

    stop_tolerance_rad: 0.0524 # 3 degrees
    tolerance_rad: 0.1745 # 10 degrees

  arm:
    kp: 120.0
    min_pwm: 180
    max_pwm: 220
    kick_pwm: 180

    stop_tolerance_rad: 0.1396 # 8 degrees
    tolerance_rad: 0.2618 # 15 degrees

  bucket:
    kp: 70.0
    min_pwm: 40
    max_pwm: 150
    kick_pwm: 80

    stop_tolerance_rad: 0.1745 # 10 degrees
    tolerance_rad: 0.2618 # 15 degrees