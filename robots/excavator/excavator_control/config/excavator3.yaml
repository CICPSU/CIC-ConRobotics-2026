# ================================================================
# Excavator 3 Configuration
# ================================================================
# Physical machine configuration for Excavator 3.
#
# Potentiometer calibration convention for boom, arm, and bucket:
#   raw_at_min_angle = ADC raw value at min_angle_deg
#   raw_at_max_angle = ADC raw value at max_angle_deg
#
# Raw ADC values may increase OR decrease as joint angle increases.
# ================================================================

excavator_name: excavator3

joints:

  boom:
    adc_channel: 1
    min_angle_deg: -60.0
    max_angle_deg: 5.0
    raw_at_min_angle: 7500
    raw_at_max_angle: 14320

  arm:
    adc_channel: 2
    min_angle_deg: 52.0
    max_angle_deg: 112.0
    raw_at_min_angle: 17800
    raw_at_max_angle: 12050

  bucket:
    adc_channel: 0
    min_angle_deg: 0.0
    max_angle_deg: 90.0
    raw_at_min_angle: 1750
    raw_at_max_angle: 25200

  swing:
    # Swing position comes from a sensor adapter publishing JointState.
    # The controller is deliberately independent of AprilTag or any future
    # replacement sensor.
    min_angle_deg: -95.0
    max_angle_deg: 95.0

# ================================================================
# GPIO
# ================================================================

gpio:
  standby_pin: 21
  shared_pwm_pin: 7

  swing:
    in1_pin: 16
    in2_pin: 20
    invert_motor: true

  boom:
    in1_pin: 8
    in2_pin: 25
    invert_motor: true

  arm:
    in1_pin: 15
    in2_pin: 14
    invert_motor: true

  bucket:
    in1_pin: 23
    in2_pin: 24
    invert_motor: true

# ================================================================
# GLOBAL CONTROL PARAMETERS
# ================================================================

control:
  publish_hz: 10.0
  control_hz: 50.0
  feedback_hz: 10.0

  goal_tolerance_rad: 0.035
  stop_on_goal_finish: true

  ads1115_address: 72
  pwm_frequency_hz: 1000
  pwm_arbitration: exclusive

# ================================================================
# HOME POSITION
# ================================================================
# Human-readable degrees.
# Boom home intentionally set to -20 deg.

home:
  boom_deg: -20.0
  arm_deg: 105.020
  bucket_deg: 12.245

# ================================================================
# PER-JOINT CONTROL PARAMETERS
# ================================================================

joint_control:

  swing:
    position_topic: /excavator3/swing_joint_state
    sensor_timeout_sec: 0.30

    far_error_deg: 15.0
    far_pwm: 255
    near_pwm: 255

    tolerance_rad: 0.0873 # 5 degrees
    stop_tolerance_rad: 0.0873 # 5 degrees

    pulse_err_deg: 5.0
    pulse_on_cycles: 1
    pulse_off_cycles: 2

    progress_timeout_sec: 0.35
    min_progress_deg: 1.0

  boom:
    kp: 120.0
    min_pwm: 130
    max_pwm: 255
    kick_pwm: 180

    tolerance_rad: 0.052 # 3 degrees
    stop_tolerance_rad: 0.035 # 2 degrees

  arm:
    kp: 120.0
    min_pwm: 180
    max_pwm: 220
    kick_pwm: 180

    tolerance_rad: 0.140 # 8 degrees
    stop_tolerance_rad: 0.122 # 7 degrees

  bucket:
    kp: 70.0
    min_pwm: 40
    max_pwm: 150
    kick_pwm: 80

    tolerance_rad: 0.175 # 10 degrees
    stop_tolerance_rad: 0.140 # 8 degrees