# ================================================================
# CIC ConRobotics - Model Excavator Configuration Template
# ================================================================
# Machine-specific configuration template for one physical
# model excavator.
#
# Create ONE configuration file for EACH physical excavator:
#
#   excavator1.yaml
#   excavator2.yaml
#   excavator3.yaml
#   excavator4.yaml
#
# The ROS 2 control code should remain common across all machines.
# Machine-specific calibration, wiring, and control parameters
# belong in this file.
#
# This template follows the configuration structure currently used
# by the working Excavator 3 system.
#
# IMPORTANT:
#   Calibration values are MACHINE-SPECIFIC.
#   Do NOT copy Excavator 3 raw ADC calibration values into another
#   excavator without physically calibrating that machine.
#
# Calibration convention:
#
#   raw_at_min_angle = ADC raw value measured at min_angle_deg
#   raw_at_max_angle = ADC raw value measured at max_angle_deg
#
# Raw ADC values may increase OR decrease as joint angle increases.
# ================================================================


# ================================================================
# EXCAVATOR IDENTIFICATION
# ================================================================
#
# Change this to match the physical machine.
#
# Example:
#   excavator1
#   excavator2
#   excavator3
#   excavator4
#
# ================================================================

excavator_name: excavatorX


# ================================================================
# JOINT SENSOR CALIBRATION
# ================================================================
#
# Boom, arm, and bucket use two-point calibration.
#
# Swing uses a multi-point calibration table.
#
# All angles are expressed in DEGREES.
#
# IMPORTANT:
#   Replace ALL placeholder raw ADC values with measurements from
#   the actual excavator before closed-loop operation.
# ================================================================

joints:

  # --------------------------------------------------------------
  # BOOM
  # --------------------------------------------------------------
  #
  # Current nominal range:
  #
  #   -60 deg ------------------------------- +5 deg
  #     MIN                                    MAX
  #
  # Measure the raw ADC value at BOTH endpoints.
  # --------------------------------------------------------------

  boom:
    adc_channel: 1

    min_angle_deg: -60.0
    max_angle_deg: 5.0

    # TODO: Measure on this excavator at -60 deg.
    raw_at_min_angle: 0

    # TODO: Measure on this excavator at +5 deg.
    raw_at_max_angle: 0


  # --------------------------------------------------------------
  # ARM
  # --------------------------------------------------------------
  #
  # Current nominal range:
  #
  #    52 deg ------------------------------ 112 deg
  #     MIN                                   MAX
  #
  # Raw ADC values may decrease as angle increases.
  # Enter the values exactly as measured.
  # --------------------------------------------------------------

  arm:
    adc_channel: 2

    min_angle_deg: 52.0
    max_angle_deg: 112.0

    # TODO: Measure on this excavator at 52 deg.
    raw_at_min_angle: 0

    # TODO: Measure on this excavator at 112 deg.
    raw_at_max_angle: 0


  # --------------------------------------------------------------
  # BUCKET
  # --------------------------------------------------------------
  #
  # Current nominal range:
  #
  #     0 deg ------------------------------- 90 deg
  #     MIN                                   MAX
  #
  # --------------------------------------------------------------

  bucket:
    adc_channel: 0

    min_angle_deg: 0.0
    max_angle_deg: 90.0

    # TODO: Measure on this excavator at 0 deg.
    raw_at_min_angle: 0

    # TODO: Measure on this excavator at 90 deg.
    raw_at_max_angle: 0


  # --------------------------------------------------------------
  # SWING
  # --------------------------------------------------------------
  #
  # Swing uses a multi-point calibration table.
  #
  # Each entry in angle_deg_table corresponds to the raw ADC
  # reading at the same index in raw_table.
  #
  # Example:
  #
  #   angle_deg_table[0] <-> raw_table[0]
  #   angle_deg_table[1] <-> raw_table[1]
  #   ...
  #
  # angle_deg_table must be ordered from minimum to maximum angle.
  #
  # raw_table may increase OR decrease depending on sensor
  # orientation, but the values must correspond to the physical
  # angles at the same positions in angle_deg_table.
  #
  # IMPORTANT:
  #   Swing must be physically calibrated and verified before use.
  #   Do not command Swing based only on this template.
  # --------------------------------------------------------------

  swing:
    adc_channel: 3

    min_angle_deg: -90.0
    max_angle_deg: 90.0

    # Current calibration-point structure used by Excavator 3.
    # Adjust only if the physical calibration procedure requires it.
    angle_deg_table:
      - -90.0
      - -45.0
      - -30.0
      - 0.0
      - 30.0
      - 45.0
      - 60.0
      - 75.0
      - 90.0

    # TODO:
    # Replace ALL values with actual measurements from this machine.
    #
    # These placeholder values are intentionally invalid as a
    # physical calibration.
    raw_table:
      - 0
      - 0
      - 0
      - 0
      - 0
      - 0
      - 0
      - 0
      - 0


# ================================================================
# GPIO
# ================================================================
#
# Current GPIO structure used by the excavator control system.
#
# Verify the physical wiring before operating a new machine.
#
# These values currently follow the wiring layout used by the
# working Excavator 3 system. If another excavator is wired
# differently, change the corresponding pins here.
#
# invert_motor controls the logical motor direction for each joint.
# Verify direction carefully during initial machine testing.
# ================================================================

gpio:

  standby_pin: 21
  shared_pwm_pin: 7

  swing:
    in1_pin: 16
    in2_pin: 20
    invert_motor: false

  boom:
    in1_pin: 8
    in2_pin: 25
    invert_motor: true

  arm:
    in1_pin: 15
    in2_pin: 14
    invert_motor: true

  bucket:
    in1_pin: 23
    in2_pin: 24
    invert_motor: true


# ================================================================
# GLOBAL CONTROL PARAMETERS
# ================================================================
#
# These values follow the current working Excavator 3 control
# configuration and provide a baseline for additional excavators.
#
# Do NOT use controller tuning to compensate for incorrect
# calibration or incorrect motor direction.
#
# Verify:
#
#   1. ADC calibration
#   2. GPIO wiring
#   3. motor direction
#   4. joint limits
#
# before tuning controller parameters.
# ================================================================

control:

  publish_hz: 10.0
  control_hz: 50.0
  feedback_hz: 10.0

  goal_tolerance_rad: 0.035
  stop_on_goal_finish: true

  ads1115_address: 72
  pwm_frequency_hz: 1000
  pwm_arbitration: exclusive


# ================================================================
# HOME POSITION
# ================================================================
#
# Human-readable joint angles in DEGREES.
#
# These values provide a starting template based on the current
# Excavator 3 configuration.
#
# Verify that the selected home position is physically safe and
# reachable on the new excavator before commanding it.
#
# Swing is intentionally not included in the home command.
# ================================================================

home:

  boom_deg: -20.0
  arm_deg: 105.020
  bucket_deg: 12.245


# ================================================================
# PER-JOINT CONTROL PARAMETERS
# ================================================================
#
# These values provide baseline controller settings based on the
# current working Excavator 3 configuration.
#
# Individual machines may require tuning because of differences in:
#
#   - mechanical friction
#   - linkage geometry
#   - motor behavior
#   - sensor noise
#   - battery / supply conditions
#
# Start with small, controlled motions when validating a new
# physical machine.
#
# tolerance_rad:
#   Target tracking tolerance used by the controller.
#
# stop_tolerance_rad:
#   Error threshold associated with stopping / final positioning.
#
# min_pwm:
#   Minimum PWM command used during active motion.
#
# max_pwm:
#   Maximum PWM command.
#
# kick_pwm:
#   Initial PWM used to overcome static friction.
# ================================================================

joint_control:

  # --------------------------------------------------------------
  # SWING
  # --------------------------------------------------------------
  #
  # Baseline values only.
  #
  # Swing requires separate physical validation before use.
  # Do NOT assume these values are safe for a newly configured
  # excavator.
  # --------------------------------------------------------------

  swing:

    kp: 120.0

    min_pwm: 220
    max_pwm: 255
    kick_pwm: 255

    tolerance_rad: 0.04
    stop_tolerance_rad: 0.05

    pulse_err_deg: 5.0
    pulse_on_cycles: 1
    pulse_off_cycles: 2


  # --------------------------------------------------------------
  # BOOM
  # --------------------------------------------------------------

  boom:

    kp: 120.0

    min_pwm: 130
    max_pwm: 255
    kick_pwm: 180

    tolerance_rad: 0.052       # approximately 3 degrees
    stop_tolerance_rad: 0.035  # approximately 2 degrees


  # --------------------------------------------------------------
  # ARM
  # --------------------------------------------------------------

  arm:

    kp: 120.0

    min_pwm: 180
    max_pwm: 220
    kick_pwm: 180

    tolerance_rad: 0.140       # approximately 8 degrees
    stop_tolerance_rad: 0.122  # approximately 7 degrees


  # --------------------------------------------------------------
  # BUCKET
  # --------------------------------------------------------------

  bucket:

    kp: 70.0

    min_pwm: 40
    max_pwm: 150
    kick_pwm: 80

    tolerance_rad: 0.175       # approximately 10 degrees
    stop_tolerance_rad: 0.140  # approximately 8 degrees