# Fixed floor landmark CENTER coordinates, meters, in the EXISTING map frame.
# Do not move the map origin or axes when relocating the tags.
# ID family: 36h11. Detector landmark size: 0.134 m (134 mm).
# The x/y values below are the surveyed Tag CENTER coordinates in the existing map frame.
# Update these values only if the physical landmark tags are relocated.
# A false/missing layout_confirmed flag deliberately prevents physical fusion initialization.
layout_confirmed: true
map_frame: map

# Startup registration only. These are initial engineering thresholds, not
# measured accuracy guarantees. After acceptance the transform NEVER updates.
registration:
  min_samples: 20
  min_duration_sec: 1.0
  max_sample_gap_sec: 0.5
  max_rms_m: 0.02
  max_point_error_m: 0.03
  max_position_deviation_m: 0.02
  max_yaw_deviation_deg: 1.0
  max_scale_deviation: 0.01
  min_scale: 0.90
  max_scale: 1.10

landmarks:
  16:
    frame: tag36h11_16
    x: -1.0
    y: 0.6
    yaw: 0.0

  17:
    frame: tag36h11_17
    x: 0.3
    y: -1.0
    yaw: 0.0

  18:
    frame: tag36h11_18
    x: 1.5
    y: 0.5
    yaw: 0.0
