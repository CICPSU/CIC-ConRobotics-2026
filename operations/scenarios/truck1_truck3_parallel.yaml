scenario_name: truck1_truck3_parallel

steps:

  - id: preparation_wait
    type: wait
    duration: 2.0

  - id: move_both_trucks
    type: parallel

    tasks:

      - id: truck1_parallel_route
        type: task
        robot: truck1
        task_type: waypoint
        task_file: truck1_waypoints.yaml

      - id: truck3_parallel_route
        type: task
        robot: truck3
        task_type: waypoint
        task_file: truck3_waypoints.yaml

  - id: final_wait
    type: wait
    duration: 2.0
